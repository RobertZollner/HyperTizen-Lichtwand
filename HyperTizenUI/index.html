<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperTizen Lichtwand</title>
    <link rel="stylesheet" href="main.css">
    <script src="js/wsClient.js"></script>
</head>
<body>
    <div class="content">
        <h1>HyperTizen Lichtwand</h1>
        <h2 id="status">Starte …</h2>
        <div class="card">
            <div>HyperHDR</div>
            <div id="server">ws://192.168.178.93:8090/</div>
            <div>Status: <span id="enabledState">…</span></div>
        </div>
        <button tabindex="0" onclick="reconnectHyperHDR()">Neu verbinden</button>
        <p>SSDP ist deaktiviert. Die Lichtwand verbindet direkt mit HyperHDR.</p>
    </div>
<script>
window.onload = function () {
    startHyperTizenLichtwand();
    const button = document.querySelector('button');
    button.focus();
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            button.click();
        }
    });
};
</script>
</body>
</html>
